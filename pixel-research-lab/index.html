<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#254737"><title>픽셀 연구실 · 나의 연구실</title>
<link rel="stylesheet" href="./style.css">
<link rel="manifest" href="./app.webmanifest">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png"></head>
<body><header class="top"><div class="navwrap"><div class="brand"><canvas width="23" height="21" id="brand-art" aria-hidden="true"></canvas>픽셀 연구실</div><nav aria-label="메인 메뉴"><button id="home-tab" aria-current="page">연구실</button><button id="journal-tab">연구 일지</button><button data-do="save-panel">세이브 관리</button></nav><span id="save-state" class="save-dot" role="status">이 브라우저에 저장</span></div></header>
<main><section id="home"><div class="titlebar"><div><div class="eyebrow"><span class="mark">✦</span> VLA RESEARCH RPG</div><h1>나의 연구실<span class="dot">.</span></h1></div><button class="primary" data-do="new"><b aria-hidden="true">＋</b> 퀘스트 등록</button></div>
<div class="layout"><section class="panel room"><div class="paneltop"><h2><span class="lamp-dot"></span>작업 책상</h2><button class="textbtn" data-do="desk">책상 꾸미기 <span aria-hidden="true">↗</span></button></div><div class="roomframe"><canvas id="room-art" width="360" height="166" role="img" aria-label="창가의 픽셀 연구실과 작업 책상"></canvas><button class="desk-speaker" data-do="music" aria-label="책상 스피커 · YouTube 음악 열기" title="YouTube 음악 열기"><span></span></button></div><div class="roomfoot"><span>장식 슬롯</span><div id="desk-summary"></div></div></section>
<section class="panel board"><div class="paneltop"><h2>퀘스트 보드</h2><span class="tiny-counter" id="active-counter"></span></div><div id="quest-board"></div></section></div>
<div class="more"><section class="panel"><div class="paneltop"><h2>스킬 수첩</h2><span class="small muted">독립 단계 이상 스킬 수</span></div><div id="skills"></div></section><section class="panel"><div class="paneltop"><h2>전리품 서랍</h2><span class="tiny-counter" id="loot-count"></span></div><div id="loot"></div></section></div></section>
<section id="journal" hidden><div class="titlebar"><div><div class="eyebrow"><span class="mark">✦</span> FIELD NOTES</div><h1>연구 일지<span class="dot">.</span></h1></div><button data-do="new" class="primary">＋ 퀘스트 등록</button></div><section class="panel"><div class="paneltop"><h2>완료한 연구</h2><span class="tiny-counter" id="done-count"></span></div><div id="journal-rows"></div></section></section>
<footer id="offline-status" class="offline-status" role="status" hidden></footer></main>
<dialog id="modal"><div class="modalbar"><span id="dialog-context"></span><button class="closebtn" aria-label="창 닫기" id="close-modal">×</button></div><div id="modal-body"></div></dialog><div id="toast" role="status" aria-live="polite"></div>
<script src="./data.js"></script><script src="./art.js"></script><script src="./transfer.js"></script><script src="./app.js"></script><script src="./offline.js"></script></body></html>
